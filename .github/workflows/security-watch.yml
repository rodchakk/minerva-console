name: Minerva Security Watch (public-advisory radar)

on:
  schedule:
    # 00:17 and 12:17 UTC => 18:17 and 06:17 in Honduras.
    - cron: "17 0,12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "security-watch/catalog.json"
      - "scripts/security-watch-*.mjs"
      - ".github/workflows/security-watch.yml"

permissions:
  contents: read
  id-token: write # GitHub-issued short-lived OIDC for the exact ingest route

concurrency:
  group: minerva-security-watch-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Scan public vulnerability advisories
        run: node scripts/security-watch-scan.mjs

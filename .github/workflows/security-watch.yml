name: Minerva Security Watch (public-advisory radar)

on:
  schedule:
    # 00:17 and 12:17 UTC -> 18:17 and 06:17 in Honduras (UTC-6).
    # Off the hour to reduce GitHub scheduling delays.
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minerva-security-watch-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Validate activation configuration
        env:
          INGEST_URL: ${{ vars.SECURITY_WATCH_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.SECURITY_WATCH_INGEST_TOKEN }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$INGEST_TOKEN" ]; then
            echo "::error::Security Watch is not activated: set the ingest URL repository variable and token secret."
            exit 1
          fi
      - name: Scan public OSV and NVD advisories
        run: node scripts/security-watch-scan.mjs
        env:
          SECURITY_WATCH_INGEST_URL: ${{ vars.SECURITY_WATCH_INGEST_URL }}
          SECURITY_WATCH_INGEST_TOKEN: ${{ secrets.SECURITY_WATCH_INGEST_TOKEN }}
